version: 6.33.4

type: DeclarativeSource

description: removed `is_read_only` attribute from dashboards stream schema

check:
  type: CheckStream
  stream_names:
    - dashboards

definitions:
  streams:
    audit_logs:
      type: DeclarativeStream
      name: audit_logs
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/audit/events
          http_method: GET
          request_headers:
            DD-APPLICATION-KEY: "{{ config['application_key'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[cursor]
            inject_into: request_parameter
          pagination_strategy:
            type: CursorPagination
            cursor_value: >-
              {{ last_record['meta']['page']['after'] if last_record else None
              }}
            stop_condition: "{{ 'page' not in last_record['meta'] }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/audit_logs"
    dashboards:
      type: DeclarativeStream
      name: dashboards
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/dashboard
          http_method: GET
          request_headers:
            DD-APPLICATION-KEY: "{{ config['application_key'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - dashboards
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/dashboards"
    downtimes:
      type: DeclarativeStream
      name: downtimes
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/downtime
          http_method: GET
          request_headers:
            DD-APPLICATION-KEY: "{{ config['application_key'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/downtimes"
    incident_teams:
      type: DeclarativeStream
      name: incident_teams
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/team
          http_method: GET
          request_headers:
            DD-APPLICATION-KEY: "{{ config['application_key'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestPath
          pagination_strategy:
            type: CursorPagination
            cursor_value: "{{ response.get(\"links\", {}).get(\"next\", {}) }}"
            stop_condition: "{{ not response.get(\"links\", {}).get(\"next\", {}) }}"
        decoder:
          type: JsonDecoder
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/incident_teams"
    incidents:
      type: DeclarativeStream
      name: incidents
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/incidents
          http_method: GET
          request_headers:
            DD-APPLICATION-KEY: "{{ config['application_key'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[offset]
            inject_into: request_parameter
          pagination_strategy:
            type: CursorPagination
            cursor_value: >-
              {{ response.get("meta", {}).get("pagination",
              {}).get("next_offset", {}) }}
            stop_condition: >-
              {{ not response.get("meta", {}).get("pagination",
              {}).get("next_offset", {}) }}
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/incidents"
    logs:
      type: DeclarativeStream
      name: logs
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/logs/events
          http_method: GET
          request_parameters:
            filter[query]: "{{ config['query'] }}"
          request_headers:
            DD-APPLICATION-KEY: "{{ config['application_key'] }}"
          error_handler:
            type: CompositeErrorHandler
            error_handlers:
              - type: DefaultErrorHandler
                max_retries: 3
                backoff_strategies:
                  - type: ExponentialBackoffStrategy
                response_filters:
                  - type: HttpResponseFilter
                    action: RETRY
                    http_codes:
                      - 429
                    error_message: Too many requests, retrying...
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestPath
          pagination_strategy:
            type: CursorPagination
            page_size: 1000
            cursor_value: "{{ response.get(\"links\", {}).get(\"next\", {}) }}"
            stop_condition: "{{ not response.get(\"links\", {}).get(\"next\", {}) }}"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: sync_date
        lookback_window: P31D
        cursor_datetime_formats:
          - "%Y-%m-%dT%H:%M:%S.%fZ"
          - "%Y-%m-%dT%H:%M:%SZ"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_datetime:
          type: MinMaxDatetime
          datetime: >-
            {{ config['start_date'] or day_delta(-30,
            format='%Y-%m-%dT%H:%M:%SZ') }}
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_time_option:
          type: RequestOption
          field_name: filter[from]
          inject_into: request_parameter
        end_time_option:
          type: RequestOption
          field_name: filter[to]
          inject_into: request_parameter
        end_datetime:
          type: MinMaxDatetime
          datetime: >-
            {{ config['end_date'] or day_delta(-1, format='%Y-%m-%dT%H:%M:%SZ')
            }}
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        step: P1M
        cursor_granularity: PT0.000001S
      transformations:
        - type: AddFields
          fields:
            - path:
                - sync_date
              value: "{{ record['attributes']['timestamp'] }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/logs"
    metrics:
      type: DeclarativeStream
      name: metrics
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/metrics
          http_method: GET
          request_headers:
            DD-APPLICATION-KEY: "{{ config['application_key'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/metrics"
    monitors:
      type: DeclarativeStream
      name: monitors
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/monitor
          http_method: GET
          request_headers:
            DD-APPLICATION-KEY: "{{ config['application_key'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/monitors"
    service_level_objectives:
      type: DeclarativeStream
      name: service_level_objectives
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/slo
          http_method: GET
          request_headers:
            DD-APPLICATION-KEY: "{{ config['application_key'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/service_level_objectives"
    synthetic_tests:
      type: DeclarativeStream
      name: synthetic_tests
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/synthetics/tests
          http_method: GET
          request_headers:
            DD-APPLICATION-KEY: "{{ config['application_key'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - tests
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/synthetic_tests"
    users:
      type: DeclarativeStream
      name: users
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/users
          http_method: GET
          request_headers:
            DD-APPLICATION-KEY: "{{ config['application_key'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[number]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[size]
            inject_into: request_parameter
          pagination_strategy:
            type: PageIncrement
            page_size: 100
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/users"
    ci_visibility_tests:
      type: DeclarativeStream
      name: ci_visibility_tests
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/ci/tests/events
          http_method: GET
          request_parameters:
            sort: timestamp
            filter[query]: "{{ config['query'] }}"
          request_headers:
            DD-APPLICATION-KEY: "{{ config['application_key'] }}"
          error_handler:
            type: CompositeErrorHandler
            error_handlers:
              - type: DefaultErrorHandler
                response_filters:
                  - type: HttpResponseFilter
                    action: RETRY
                    http_codes:
                      - 429
                    error_message: Too many requests, retrying...
                backoff_strategies:
                  - type: WaitTimeFromHeader
                    header: x-ratelimit-reset
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestPath
          page_size_option:
            type: RequestOption
            field_name: page[limit]
            inject_into: request_parameter
          pagination_strategy:
            type: CursorPagination
            page_size: 1000
            cursor_value: "{{ response.get(\"links\", {}).get(\"next\", {}) }}"
            stop_condition: "{{ not response.get(\"links\", {}).get(\"next\", {}) }}"
        decoder:
          type: JsonDecoder
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: sync_date
        cursor_datetime_formats:
          - "%Y-%m-%dT%H:%M:%S.%fZ"
          - "%Y-%m-%dT%H:%M:%SZ"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_datetime:
          type: MinMaxDatetime
          datetime: >-
            {{ config['start_date'] or day_delta(-30,
            format='%Y-%m-%dT%H:%M:%SZ') }}
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_time_option:
          type: RequestOption
          field_name: filter[from]
          inject_into: request_parameter
        end_time_option:
          type: RequestOption
          field_name: filter[to]
          inject_into: request_parameter
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - sync_date
              value: "{{ record['attributes']['timestamp'] }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/ci_visibility_tests"
      ci_visibility_pipelines:
        type: DeclarativeStream
        name: ci_visibility_pipelines
        primary_key:
          - id
        retriever:
          type: SimpleRetriever
          requester:
            $ref: "#/definitions/base_requester"
            path: v2/ci/pipelines/events
            http_method: GET
            request_parameters:
              sort: timestamp
              filter[query]: "{{ config['query'] }}"
            request_headers:
              DD-APPLICATION-KEY: "{{ config['application_key'] }}"
            error_handler:
              type: CompositeErrorHandler
              error_handlers:
                - type: DefaultErrorHandler
                  response_filters:
                    - type: HttpResponseFilter
                      action: RETRY
                      http_codes:
                        - 429
                      error_message: Too many requests, retrying...
                  backoff_strategies:
                    - type: WaitTimeFromHeader
                      header: x-ratelimit-reset
          record_selector:
            type: RecordSelector
            extractor:
              type: DpathExtractor
              field_path:
                - data
          paginator:
            type: DefaultPaginator
            page_token_option:
              type: RequestPath
            page_size_option:
              type: RequestOption
              field_name: page[limit]
              inject_into: request_parameter
            pagination_strategy:
              type: CursorPagination
              page_size: 1000
              cursor_value: "{{ response.get(\"links\", {}).get(\"next\", {}) }}"
              stop_condition: "{{ not response.get(\"links\", {}).get(\"next\", {}) }}"
          decoder:
            type: JsonDecoder
        incremental_sync:
          type: DatetimeBasedCursor
          cursor_field: sync_date
          cursor_datetime_formats:
            - "%Y-%m-%dT%H:%M:%S.%fZ"
            - "%Y-%m-%dT%H:%M:%SZ"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
          start_datetime:
            type: MinMaxDatetime
            datetime: >-
              {{ config['start_date'] or day_delta(-30,
              format='%Y-%m-%dT%H:%M:%SZ') }}
            datetime_format: "%Y-%m-%dT%H:%M:%SZ"
          start_time_option:
            type: RequestOption
            field_name: filter[from]
            inject_into: request_parameter
          end_time_option:
            type: RequestOption
            field_name: filter[to]
            inject_into: request_parameter
          end_datetime:
            type: MinMaxDatetime
            datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
            datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        transformations:
          - type: AddFields
            fields:
              - type: AddedFieldDefinition
                path:
                  - sync_date
                value: "{{ record['attributes']['timestamp'] }}"
        schema_loader:
          type: InlineSchemaLoader
          schema:
            $ref: "#/schemas/ci_visibility_pipelines"
  base_requester:
    type: HttpRequester
    url_base: https://api.{{ config['site'] }}/api/
    authenticator:
      type: ApiKeyAuthenticator
      api_token: "{{ config[\"api_key\"] }}"
      inject_into:
        type: RequestOption
        field_name: DD-API-KEY
        inject_into: header

