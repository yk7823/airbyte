  incidents:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    additionalProperties: true
    properties:
      type:
        type:
          - string
        description: "Incident resource type. Allowed enum values: incidents"
        enum:
          - incidents
        readOnly: true
      attributes:
        type:
          - object
          - "null"
