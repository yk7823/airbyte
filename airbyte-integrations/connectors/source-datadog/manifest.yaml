schemas:
  audit_logs:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    additionalProperties: true
    properties:
      type:
        type:
          - string
          - "null"
        description: "Type of the event. Allowed enum values: audit"
        enum:
          - audit
        readOnly: true
      attributes:
        type:
          - object
          - "null"
        description: >-
          JSON object containing all event attributes and their associated
          values.
        additionalProperties: true
        properties:
          attributes:
            type:
              - object
              - "null"
            description: JSON object of attributes from Audit Logs events.
            additionalProperties: true
          service:
            type:
              - string
              - "null"
            description: Name of the application or service generating Audit Logs events.
          tags:
            type:
              - array
              - "null"
            description: Array of tags associated with your event.
            items:
              type: string
          timestamp:
            type:
              - string
              - "null"
            description: Timestamp of your event.
            format: date-time
      id:
        type:
          - string
          - "null"
        description: Unique ID of the event.
        readOnly: true
      sync_date:
        type:
          - "null"
          - string
  dashboards:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    additionalProperties: true
    properties:
      description:
        type:
          - string
          - "null"
        description: Description of the dashboard.
        readOnly: true
      author_handle:
        type:
          - string
          - "null"
        description: Identifier of the dashboard author.
        readOnly: true
      created_at:
        type:
          - string
          - "null"
        description: Creation date of the dashboard.
